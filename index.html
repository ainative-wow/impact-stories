:root {
  --az-dark: #003781;
  --az-white: #FFFFFF;
  --az-mid-gray: #414141;
  --az-light-gray: #CFCFCF;
  --az-light-blue: #006192;
  --az-turquoise: #007AB3;

  --font-display: "Allianz Neo", "Manrope", sans-serif;
  --font-body: "Allianz Neo Condensed", "DM Sans", sans-serif;
  --title-size: clamp(2.25rem, 9vw, 6.5rem);
  --page-padding: clamp(1.5rem, 5vw, 4rem);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

body {
  font-family: var(--font-body);
  color: var(--az-mid-gray);
  background:
    radial-gradient(ellipse at 15% 85%, rgba(0, 55, 129, 0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 15%, rgba(0, 122, 179, 0.10) 0%, transparent 55%),
    var(--az-white);
}

.page {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: var(--page-padding);
}

.masthead img {
  height: clamp(26px, 3.2vw, 44px);
  width: auto;
  display: block;
}

main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}

h1 {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--az-dark);
  font-size: var(--title-size);
  line-height: 1.02;
  letter-spacing: -0.02em;
  margin: 0;
  max-width: 16ch;
  opacity: 0;
  transform: translateY(24px);
  animation: reveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
}

h1 .star { color: var(--az-turquoise); }

.rule {
  width: clamp(64px, 12vw, 160px);
  height: 4px;
  margin-top: clamp(1.25rem, 3vw, 2.25rem);
  background: linear-gradient(90deg, var(--az-dark), var(--az-turquoise));
  transform-origin: left;
  transform: scaleX(0);
  animation: grow 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
}

footer {
  border-top: 1px solid var(--az-light-gray);
  padding-top: clamp(0.75rem, 2vw, 1.25rem);
}

@keyframes reveal {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes grow {
  to { transform: scaleX(1); }
}

@media (prefers-reduced-motion: reduce) {
  h1, .rule { animation-duration: 0.01ms; animation-delay: 0ms; }
}
</style>
</head>
