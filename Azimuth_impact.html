<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azimuth (AIDLC)</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F7F9FD;--card:rgba(255,255,255,.88);--ink:#0A1020;--muted:#5E6B87;--line:#DCE3F1;
  --blue:#2563FF;--cyan:#12C8E8;--grad:linear-gradient(90deg,#2563FF,#12C8E8);
  --sans:"Sora","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
#net{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:22px 22px 24px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
h1{font-weight:600;font-size:17px;line-height:1.2;letter-spacing:-.01em;margin:0;white-space:nowrap;padding-right:16px;border-right:1px solid var(--line)}
h1 span{font-weight:600;font-size:1em;margin-left:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;color:var(--muted);font-weight:300;font-size:12px;line-height:1.45}

.frame{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px 18px;backdrop-filter:blur(6px)}
.frame>.tag{position:absolute;top:-9px;left:20px;background:var(--bg);padding:0 8px;font-family:var(--mono);font-size:11px;color:var(--blue)}

.track{position:relative;height:84px;margin:0 84px}
.rail{position:absolute;left:0;right:0;top:20px;height:2px;background:var(--line)}
.fill{position:absolute;left:0;top:20px;height:2px;width:0;background:var(--grad);transition:width 1s cubic-bezier(.6,.05,.2,1)}
.arrow{position:absolute;top:14px;width:12px;height:12px;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:translateX(-100%) rotate(45deg);transform-origin:center;transition:border-color .4s}
.arrow.f{border-color:var(--blue)}
.pt{position:absolute;top:15px;left:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--blue);transition:left 1s cubic-bezier(.6,.05,.2,1);box-shadow:0 0 0 5px rgba(37,99,255,.14);z-index:3}
.node{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.ring{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .35s;position:relative;z-index:2}
.ring svg{width:19px;height:19px}
.node b{font-weight:600;font-size:14px;line-height:1.2}
.node small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.node:hover .ring,.node.past .ring{border-color:var(--blue);color:var(--blue)}
.node.on .ring{background:var(--grad);border-color:transparent;color:#fff;transform:scale(1.08)}

.band{display:grid;grid-template-columns:1.55fr 1fr 1fr;border-top:1px solid var(--line);margin-top:6px}
.grp{padding:14px 16px 6px 0}
.grp+.grp{padding-left:16px;border-left:1px solid var(--line)}
.gh{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12px;margin-bottom:9px}
.gh svg{color:var(--blue)}
.items{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;background:#fff;font-size:12px;transition:all .25s}
.chip svg{color:var(--blue);width:14px;height:14px}
.chip:hover{border-color:var(--blue);transform:translateY(-1px)}
.chip.sel{background:var(--grad);border-color:transparent;color:#fff}
.chip.sel svg{color:#fff}
.plus{font-family:var(--mono);color:var(--muted);font-size:12px}
.note{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.net{width:100%;max-width:150px;height:34px;margin-top:6px;display:block}
.net line{stroke:var(--blue);stroke-width:1;opacity:.5;stroke-dasharray:3 4}
@media (prefers-reduced-motion:no-preference){.net line{animation:dsh 1.4s linear infinite}}
@keyframes dsh{to{stroke-dashoffset:-14}}
.net circle{fill:#fff;stroke:var(--blue);stroke-width:1.4}
.net circle.c{fill:var(--blue)}

.foot{display:flex;align-items:center;gap:12px;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.rp{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:#fff;color:var(--blue)}
.rp:hover{border-color:var(--blue)}
.read b{color:var(--blue);font-weight:500}

@media (max-width:620px){.head{flex-direction:column;align-items:flex-start;gap:6px}h1{border-right:0;padding-right:0}}
@media (max-width:720px){
  .band{grid-template-columns:1fr}
  .grp,.grp+.grp{padding:12px 0 6px;border-left:0}
  .grp+.grp{border-top:1px solid var(--line)}
  .track{margin:0 52px}
}
@media (max-width:420px){.wrap{padding:14px}.frame{padding:20px 14px 14px}.track{margin:0 40px}.node b{font-size:12px}}
</style>
</head>
<body>
<canvas id="net"></canvas>
<div class="wrap">

  <div class="head">
    <h1>Azimuth<span>(AIDLC)</span></h1>
    <p class="lead">An elaboration → execution → close lifecycle with role-based AI subagents, Jira + Confluence integration, and a knowledge wiki the team built and connected to Azimuth itself.</p>
  </div>

  <div class="frame">
    <span class="tag">azimuth</span>

    <div class="track">
      <div class="rail"></div><div class="fill" id="fill"></div>
      <span class="arrow" id="a0" style="left:50%"></span><span class="arrow" id="a1" style="left:100%"></span>
      <span class="pt" id="pt"></span>
      <button class="node" data-p="0" style="left:0">
        <span class="ring"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 5-8 3-11 8"/></svg></span>
        <b>Elaboration</b><small>1</small>
      </button>
      <button class="node" data-p="1" style="left:50%">
        <span class="ring"><svg class="i" viewBox="0 0 24 24"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/></svg></span>
        <b>Execution</b><small>2</small>
      </button>
      <button class="node" data-p="2" style="left:100%">
        <span class="ring"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></span>
        <b>Close</b><small>3</small>
      </button>
    </div>

    <div class="band">
      <div class="grp">
        <div class="gh"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>Role-based AI subagents</div>
        <div class="items">
          <button class="chip" data-t="Subagent · Business Analyst"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>Business Analyst</button>
          <button class="chip" data-t="Subagent · Backend / Frontend Developer"><svg class="i" viewBox="0 0 24 24"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/></svg>Backend / Frontend Developer</button>
          <button class="chip" data-t="Subagent · Architect"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>Architect</button>
          <button class="chip" data-t="Subagent · Security Specialist"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>Security Specialist</button>
        </div>
      </div>
      <div class="grp">
        <div class="gh"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>Integration</div>
        <div class="items">
          <button class="chip" data-t="Jira · integration"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h18v3a2 2 0 000 4v3H3v-3a2 2 0 000-4V7z"/><path d="M9 7v10" stroke-dasharray="2 2"/></svg>Jira</button>
          <span class="plus">+</span>
          <button class="chip" data-t="Confluence · integration"><svg class="i" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg>Confluence</button>
        </div>
      </div>
      <div class="grp">
        <div class="gh"><svg class="i" viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5z"/><path d="M4 19a2 2 0 012-2h13"/></svg>Knowledge wiki</div>
        <div class="items">
          <button class="chip" data-t="Knowledge wiki · built by the team, connected to Azimuth itself"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>Built by the team</button>
        </div>
        <svg class="net" viewBox="0 0 150 34" aria-hidden="true">
          <line x1="12" y1="17" x2="75" y2="17"/><line x1="75" y1="17" x2="138" y2="17"/>
          <line x1="12" y1="17" x2="43" y2="5"/><line x1="12" y1="17" x2="43" y2="29"/>
          <line x1="138" y1="17" x2="107" y2="5"/><line x1="138" y1="17" x2="107" y2="29"/>
          <line x1="43" y1="5" x2="75" y2="17"/><line x1="43" y1="29" x2="75" y2="17"/><line x1="107" y1="5" x2="75" y2="17"/><line x1="107" y1="29" x2="75" y2="17"/>
          <circle cx="12" cy="17" r="3.5"/><circle cx="43" cy="5" r="3"/><circle cx="43" cy="29" r="3"/>
          <circle cx="107" cy="5" r="3"/><circle cx="107" cy="29" r="3"/><circle cx="138" cy="17" r="3.5"/>
          <circle class="c" cx="75" cy="17" r="5"/>
        </svg>
        <div class="note">connected to Azimuth itself</div>
      </div>
    </div>
  </div>

  <div class="foot"><button class="rp" id="replay">replay</button><span class="read" id="read">select any item</span></div>
</div>

<script>
(function(){
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var N=['Elaboration','Execution','Close'],t=null,cur=-1;
var nodes=[].slice.call(document.querySelectorAll('[data-p]')),chips=[].slice.call(document.querySelectorAll('[data-t]'));
var rd=document.getElementById('read'),fill=document.getElementById('fill'),pt=document.getElementById('pt');
function paint(i){
  cur=i;
  nodes.forEach(function(b,k){b.className='node'+(k===i?' on':k<i?' past':'')});
  var p=i<0?0:i*50;fill.style.width=p+'%';pt.style.left=p+'%';
  document.getElementById('a0').className='arrow'+(i>=1?' f':'');
  document.getElementById('a1').className='arrow'+(i>=2?' f':'');
  chips.forEach(function(x){x.classList.remove('sel')});
  rd.innerHTML=i<0?'select any item':'phase '+(i+1)+' of 3 · <b>'+N[i]+'</b>'+(i<2?' → '+N[i+1]:'');
}
function stop(){if(t){clearInterval(t);t=null}}
function run(){stop();paint(0);t=setInterval(function(){if(cur>=2){stop();return}paint(cur+1)},1500)}
nodes.forEach(function(b,k){b.onclick=function(){stop();paint(k)}});
chips.forEach(function(b){b.onclick=function(){stop();paint(-1);b.classList.add('sel');rd.innerHTML='<b>'+b.getAttribute('data-t')+'</b>'}});
document.getElementById('replay').onclick=run;

var cv=document.getElementById('net'),ctx=cv.getContext('2d'),W=0,H=0,pts=[],mouse={x:-999,y:-999};
function size(){var d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);
  var n=Math.min(70,Math.round(W*H/20000));pts=[];for(var i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35})}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<pts.length;i++){var a=pts[i];
    if(!reduce){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1}
    for(var j=i+1;j<pts.length;j++){var b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){ctx.strokeStyle='rgba(37,99,255,'+(.14*(1-d/130)).toFixed(3)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
    var mx=a.x-mouse.x,my=a.y-mouse.y,md=Math.sqrt(mx*mx+my*my);
    if(md<170){ctx.strokeStyle='rgba(18,200,232,'+(.45*(1-md/170)).toFixed(3)+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke()}
    ctx.fillStyle='rgba(37,99,255,.38)';ctx.beginPath();ctx.arc(a.x,a.y,1.7,0,6.283);ctx.fill();
  }
  if(!reduce)requestAnimationFrame(draw);
}
addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('mouseleave',function(){mouse.x=-999;mouse.y=-999});
addEventListener('resize',function(){size();if(reduce)draw()});
size();draw();
if(!reduce)setTimeout(run,700);
})();
</script>
</body>
</html>
